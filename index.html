
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shechter Studio PRO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101018;color:white;font-family:Arial,sans-serif}
header{padding:18px;text-align:center;background:#202033;font-size:22px;font-weight:bold}
main{max-width:650px;margin:auto;padding:15px}
section{background:#222232;padding:16px;border-radius:15px;margin-bottom:15px}
h3{margin:0 0 14px}
button,select,input{font:inherit}
button{background:#7455ef;color:white;border:0;border-radius:9px;padding:12px;margin:4px}
input,select{max-width:100%;padding:10px;margin:6px 0;border-radius:8px}
input[type=text]{width:100%}
video{width:100%;height:100%;object-fit:contain}
#stage{position:relative;background:black;width:100%;aspect-ratio:9/16;max-height:65vh;margin:auto;overflow:hidden}
#caption{position:absolute;bottom:12%;width:100%;text-align:center;font-weight:bold;overflow-wrap:anywhere;text-shadow:2px 2px 5px black;pointer-events:none}
label{display:block;margin-top:10px}
small{color:#bbb}
</style>
</head>
<body>
<header>🎬 Shechter Studio PRO</header>
<main>
<section>
<h3>העלאת סרטון</h3>
<input type="file" id="file" accept="video/*">
<label>יחס מסך</label>
<select id="ratio">
<option value="9/16">9:16 סטטוס</option>
<option value="16/9">16:9 רוחב</option>
<option value="1/1">1:1 ריבוע</option>
<option value="4/5">4:5</option>
<option value="4/3">4:3</option>
</select>
<div id="stage">
<video id="video" controls playsinline></video>
<div id="caption"></div>
</div>
</section>
<section>
<h3>כותרות בעברית</h3>
<input id="words" type="text" placeholder="כתוב כותרת לסרטון">
<label>גודל טקסט</label>
<input id="size" type="range" min="18" max="65" value="32">
<label>צבע טקסט</label>
<input id="color" type="color" value="#ffffff">
<label>מיקום</label>
<select id="position">
<option value="12%">למטה</option>
<option value="45%">באמצע</option>
<option value="78%">למעלה</option>
</select>
<label>תחילת הכותרת בשניות</label>
<input id="textStart" type="number" min="0" value="0">
<label>סיום הכותרת בשניות</label>
<input id="textEnd" type="number" min="0" value="5">
<button id="add">הוסף כותרת לציר הזמן</button>
<div id="titles"></div>
</section>
<section>
<h3>חיתוך סרטון</h3>
<label>התחלה בשניות</label>
<input id="start" type="number" min="0" value="0">
<label>סיום בשניות (0 = סוף הסרטון)</label>
<input id="end" type="number" min="0" value="0">
<button id="preview">נגן את הקטע</button>
</section>
<section>
<h3>מוזיקת רקע</h3>
<input id="music" type="file" accept="audio/*">
<audio id="audio" controls></audio>
</section>
<section>
<h3>שמירת הפרויקט</h3>
<button id="save">שמור הגדרות</button>
<small>שמירת ההגדרות אינה מייצאת סרטון. ייצוא וידאו יתווסף בשדרוג הבא.</small>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
let titles=[],url="",audioUrl="";
const video=$("video");
$("file").onchange=e=>{
 if(url)URL.revokeObjectURL(url);
 const f=e.target.files[0];
 if(!f)return;
 url=URL.createObjectURL(f);
 video.src=url;
};
$("ratio").onchange=e=>$("stage").style.aspectRatio=e.target.value;
$("music").onchange=e=>{
 if(audioUrl)URL.revokeObjectURL(audioUrl);
 const f=e.target.files[0];
 if(!f)return;
 audioUrl=URL.createObjectURL(f);
 $("audio").src=audioUrl;
};
function update(){
 const t=video.currentTime;
 const active=titles.filter(x=>t>=x.start&&t<x.end).at(-1);
 const c=$("caption");
 c.textContent=active?active.text:"";
 if(active){
 c.style.fontSize=active.size+"px";
 c.style.color=active.color;
 c.style.bottom=active.position;
 }
}
video.ontimeupdate=()=>{
 update();
 const end=Number($("end").value);
 if(end>0&&video.currentTime>=end){
 video.pause();
 $("audio").pause();
 }
};
$("add").onclick=()=>{
 const text=$("words").value.trim();
 const start=Number($("textStart").value);
 const end=Number($("textEnd").value);
 if(!text||end<=start){alert("יש להזין כותרת וזמנים תקינים");return}
 titles.push({
 text,start,end,
 size:Number($("size").value),
 color:$("color").value,
 position:$("position").value
 });
 $("titles").textContent=titles.map(x=>x.start+"–"+x.end+": "+x.text).join(" | ");
 update();
};
$("preview").onclick=async()=>{
 if(!video.src){alert("בחר סרטון קודם");return}
 const start=Math.max(0,Number($("start").value)||0);
 const end=Number($("end").value);
 if(end>0&&end<=start){alert("זמן הסיום חייב להיות אחרי ההתחלה");return}
 video.currentTime=start;
 try{
 await video.play();
 if($("audio").src){
 $("audio").currentTime=0;
 await $("audio").play();
 }
 }catch(e){alert("לא ניתן להתחיל ניגון: "+e.message)}
};
$("save").onclick=()=>{
 const data={
 ratio:$("ratio").value,titles,
 start:$("start").value,end:$("end").value
 };
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="shechter-project.json";
 a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};
</script>
</body>
</html>

<script>
(function(){
const section=document.createElement("section");
section.innerHTML=`
<h3>🎬 ייצוא סרטון ערוך</h3>
<button id="exportVideo">ייצוא והורדת סרטון</button>
<p id="exportStatus"></p>
`;
document.querySelector("main").appendChild(section);

document.getElementById("exportVideo").onclick=async()=>{
const v=document.getElementById("video");
const status=document.getElementById("exportStatus");
const button=document.getElementById("exportVideo");

if(!v.src){
 alert("יש לבחור סרטון קודם");
 return;
}
if(!window.MediaRecorder){
 alert("הדפדפן אינו תומך בייצוא");
 return;
}

const canvas=document.createElement("canvas");
const ratio=document.getElementById("ratio").value.split("/");
const w=720;
const h=Math.round(w*Number(ratio[1])/Number(ratio[0]));
canvas.width=w;
canvas.height=h;
const ctx=canvas.getContext("2d");
const stream=canvas.captureStream(30);

const types=[
"video/mp4",
"video/webm;codecs=vp9",
"video/webm;codecs=vp8",
"video/webm"
];
const mime=types.find(t=>MediaRecorder.isTypeSupported(t));
if(!mime){alert("אין פורמט ייצוא נתמך");return;}

let recorder;
try{
recorder=new MediaRecorder(stream,{mimeType:mime});
}catch(e){alert("שגיאת ייצוא: "+e.message);return;}

const chunks=[];
recorder.ondataavailable=e=>{
 if(e.data.size)chunks.push(e.data);
};
recorder.onstop=()=>{
 const blob=new Blob(chunks,{type:mime});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="Shechter-Studio-PRO."+
 (mime.includes("mp4")?"mp4":"webm");
 a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),30000);
 status.textContent="הייצוא הסתיים";
 button.disabled=false;
};

const start=Math.max(0,Number(document.getElementById("start").value)||0);
const requestedEnd=Number(document.getElementById("end").value);
const end=requestedEnd>start?Math.min(requestedEnd,v.duration):v.duration;
if(!Number.isFinite(end)||end<=start){
 alert("זמני הסרטון אינם תקינים");
 return;
}

button.disabled=true;
status.textContent="מכין את הסרטון...";
v.pause();
v.currentTime=start;
await new Promise(resolve=>{
 if(Math.abs(v.currentTime-start)<0.1)return resolve();
 v.addEventListener("seeked",resolve,{once:true});
});

let stopped=false;
let frameId;
function draw(){
 if(stopped)return;
 ctx.fillStyle="black";
 ctx.fillRect(0,0,w,h);
 if(v.readyState>=2){
 const scale=Math.min(w/v.videoWidth,h/v.videoHeight);
 const vw=v.videoWidth*scale;
 const vh=v.videoHeight*scale;
 ctx.drawImage(v,(w-vw)/2,(h-vh)/2,vw,vh);
 }
 const active=titles.filter(x=>
 v.currentTime>=x.start&&v.currentTime<x.end
 ).at(-1);
 if(active){
 ctx.fillStyle=active.color;
 ctx.font="bold "+Math.round(active.size*w/360)+"px Arial";
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.shadowColor="black";
 ctx.shadowBlur=7;
 const y=h*(1-parseFloat(active.position)/100);
 ctx.fillText(active.text,w/2,y,w*0.9);
 ctx.shadowBlur=0;
 }
 if(v.currentTime>=end||v.ended){
 finish();
 return;
 }
 frameId=requestAnimationFrame(draw);
}
function finish(){
 if(stopped)return;
 stopped=true;
 cancelAnimationFrame(frameId);
 v.pause();
 if(recorder.state!=="inactive")recorder.stop();
}
recorder.onerror=()=>{
 status.textContent="אירעה שגיאה בהקלטה";
 button.disabled=false;
 finish();
};
try{
 recorder.start(1000);
 await v.play();
 draw();
 status.textContent="מייצא סרטון... אין לסגור את הדף";
}catch(e){
 finish();
 status.textContent="שגיאה: "+e.message;
}
};
})();
</script>
