<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15151e"><link rel="manifest" href="manifest.webmanifest"><title>Shechter Studio PRO</title><style>body{margin:0;background:#101018;color:white;font:16px Arial,sans-serif}header{padding:18px;background:#20202c;font-weight:bold;text-align:center}main{max-width:800px;margin:auto;padding:16px}.panel{background:#20202c;border-radius:15px;padding:15px;margin:12px 0}video{width:100%;max-height:55vh;background:black}button,input{font:inherit}button{background:#8b5cf6;border:0;color:white;border-radius:9px;padding:10px;margin:4px}input[type=text]{padding:10px;width:85%;border-radius:8px}label{display:block;margin:10px 0}.preview{position:relative;background:black}.caption{position:absolute;bottom:14%;left:5%;right:5%;text-align:center;font-weight:bold;text-shadow:0 2px 5px black;pointer-events:none;white-space:pre-wrap}.small{color:#bcbcca;font-size:13px}</style></head><body><header>🎬 Shechter Studio PRO</header><main><div class="panel"><label>בחר סרטון מהטלפון <input id="file" type="file" accept="video/*"></label><div class="preview"><video id="video" controls playsinline></video><div class="caption" id="caption"></div></div></div><div class="panel"><h3>מלל בעברית</h3><input id="text" type="text" placeholder="כתוב כותרת לסרטון"><label>גודל טקסט <input id="size" type="range" min="16" max="64" value="32"></label><label>צבע <input id="color" type="color" value="#ffffff"></label><label>מיקום <select id="position"><option value="14%">למטה</option><option value="45%">באמצע</option><option value="78%">למעלה</option></select></label></div><div class="panel"><h3>חיתוך ותצוגה</h3><label>התחלה (שניות) <input id="start" type="number" min="0" value="0" step="0.1"></label><label>סיום (שניות, 0 = סוף הסרטון) <input id="end" type="number" min="0" value="0" step="0.1"></label><button id="play">נגן קטע</button><button id="save">שמור הגדרות פרויקט</button><p class="small">גרסת התחלה: תצוגת מלל וחיתוך לניגון בלבד. ייצוא MP4, שכבות וכתוביות אוטומטיות עדיין אינם זמינים.</p></div></main><script>const $=id=>document.getElementById(id),v=$('video');let url; $('file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);v.src=url};function update(){let c=$('caption');c.textContent=$('text').value;c.style.fontSize=$('size').value+'px';c.style.color=$('color').value;c.style.bottom=$('position').value}['text','size','color','position'].forEach(id=>$(id).addEventListener('input',update));$('play').onclick=()=>{if(!v.src)return alert('בחר סרטון');let s=Number($('start').value)||0,e=Number($('end').value)||v.duration;if(s>=e)return alert('זמן ההתחלה חייב להיות לפני הסיום');v.currentTime=s;v.play()};v.ontimeupdate=()=>{let e=Number($('end').value);if(e>0&&v.currentTime>=e)v.pause()};$('save').onclick=()=>{let data={text:$('text').value,size:$('size').value,color:$('color').value,position:$('position').value,start:$('start').value,end:$('end').value};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='shechter-project.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
